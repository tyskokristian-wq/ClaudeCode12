name: TikTok daily post

on:
  schedule:
    # GitHub often starts scheduled runs late, so start at 13:40 Moscow time
    # (10:40 UTC) and wait inside the job until exactly 14:00.
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      now:
        description: "Post right away (skip waiting for 14:00)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: tiktok-daily

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Europe/Moscow
      POST_TIME: ${{ vars.POST_TIME || '14:00' }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REDIRECT_URI: ${{ vars.TIKTOK_REDIRECT_URI || format('https://github.com/{0}', github.repository) }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'PUBLIC_TO_EVERYONE' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Make today's video
        id: video
        run: |
          caption=$(python3 tiktok/make_video.py video.mp4)
          echo "caption=$caption" >> "$GITHUB_OUTPUT"
          echo "Caption: $caption"

      - name: Wait until the posting time
        if: ${{ github.event_name == 'schedule' || !inputs.now }}
        run: |
          target=$(date -d "today $POST_TIME" +%s); now=$(date +%s)
          if [ "$target" -gt "$now" ]; then
            echo "Waiting $((target - now)) s until $POST_TIME"; sleep $((target - now))
          fi

      - name: Publish to TikTok
        env:
          CAPTION: ${{ steps.video.outputs.caption }}
        run: python3 tiktok/tiktok.py post video.mp4 "$CAPTION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: video.mp4
          retention-days: 7

      - name: Save rotated token and log (keeps the schedule alive)
        if: always()
        run: |
          echo "$(date '+%F %T') ${{ job.status }}" >> tiktok/history.log
          git config user.name "tiktok-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tiktok/history.log tiktok/token.enc 2>/dev/null || git add tiktok/history.log
          git commit -m "TikTok post $(date +%F)" && git push || true
